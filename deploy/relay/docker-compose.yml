# Le relais de Cobblestone.
# Nginx sur le VPS proxifie vers 127.0.0.1:8787 (voir sync.nginx.conf).
# Lancer : docker compose up -d --build
services:
  relay:
    build:
      context: ../..
      dockerfile: apps/relay/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:8787:8787'
    env_file:
      - path: .env
        required: false
    volumes:
      - relay_data:/app/data
volumes:
  relay_data:
