# Cobblestone — app web (PWA).
# Copier dans /etc/nginx/sites-available/, lien dans sites-enabled/, puis :
#   sudo certbot --nginx -d cobblestone.marc-antoinemarie.com
#   sudo systemctl reload nginx
#
# Le build Vite va dans /var/www/cobblestone/ (le workflow CI/CD s'en charge).

server {
    listen 80;
    listen [::]:80;
    server_name cobblestone.marc-antoinemarie.com;

    root /var/www/cobblestone;
    index index.html;

    # SPA : toutes les routes renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker : jamais en cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Manifest PWA : cache court
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
        types { application/manifest+json webmanifest; }
    }

    # Assets statiques avec hash Vite : cache long
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Compression
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 256;
}
