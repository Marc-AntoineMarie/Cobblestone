# Cobblestone — relay de synchronisation (WebSocket).
# Copier dans /etc/nginx/sites-available/, lien dans sites-enabled/, puis :
#   sudo certbot --nginx -d sync.cobblestone.marc-antoinemarie.com
#   sudo systemctl reload nginx
#
# Le relay Docker écoute sur 127.0.0.1:8787 (voir docker-compose.yml).

server {
    listen 80;
    listen [::]:80;
    server_name sync.cobblestone.marc-antoinemarie.com;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pas de timeout sur les connexions WebSocket longues
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
